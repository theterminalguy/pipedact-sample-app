name: PIPEDA & SOC 2 Compliance Test Suite
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pipedact
        run: go install github.com/theterminalguy/pipedact/cmd/pipedact@latest
      - name: Run Fixtures Acceptance & Regression Test Suite
        run: node scripts/verify-fixtures.js
      - name: Run Privacy Linter on Clean Suite (Strict Mode)
        run: pipedact check fixtures/secure --strict --format sarif --out audit.sarif
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: audit.sarif
